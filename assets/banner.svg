<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Drop-Pod">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="1" stop-color="#151a2e"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5266"/>
      <stop offset="0.5" stop-color="#9aa3b8"/>
      <stop offset="1" stop-color="#3a4054"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#fff4c2"/>
      <stop offset="0.4" stop-color="#ffab2e"/>
      <stop offset="1" stop-color="#ff3b1f" stop-opacity="0"/>
    </radialGradient>
    <style>
      .star { fill: #e8ecff; animation: twinkle 3s ease-in-out infinite; }
      .star:nth-child(2n) { animation-delay: 1s; }
      .star:nth-child(3n) { animation-delay: 2s; }
      @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
      #pod { animation: descend 4s ease-in-out infinite; transform-origin: 600px 160px; }
      @keyframes descend { 0%,100% { transform: translateY(-10px) } 50% { transform: translateY(10px) } }
      #fire { animation: flicker .18s linear infinite alternate; transform-origin: 600px 200px; }
      @keyframes flicker { from { transform: scaleY(1) scaleX(1) } to { transform: scaleY(1.25) scaleX(.9) } }
      .streak { stroke: #8fa3ff; stroke-width: 2; stroke-linecap: round; opacity: .5; animation: rush 1.2s linear infinite; }
      @keyframes rush { from { transform: translateY(-160px) } to { transform: translateY(160px) } }
      .title { font: 700 64px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f2f4ff; letter-spacing: 6px; }
      .sub { font: 400 20px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9aa3b8; letter-spacing: 2px; }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>

  <g>
    <circle class="star" cx="80" cy="40" r="1.6"/><circle class="star" cx="210" cy="120" r="1.2"/>
    <circle class="star" cx="330" cy="60" r="1.8"/><circle class="star" cx="150" cy="240" r="1.3"/>
    <circle class="star" cx="420" cy="200" r="1.1"/><circle class="star" cx="880" cy="50" r="1.7"/>
    <circle class="star" cx="960" cy="180" r="1.2"/><circle class="star" cx="1080" cy="90" r="1.9"/>
    <circle class="star" cx="1140" cy="250" r="1.3"/><circle class="star" cx="760" cy="270" r="1.1"/>
    <circle class="star" cx="500" cy="30" r="1.4"/><circle class="star" cx="1020" cy="300" r="1.5"/>
  </g>

  <g>
    <line class="streak" x1="540" y1="20" x2="540" y2="60"/>
    <line class="streak" x1="660" y1="90" x2="660" y2="130" style="animation-delay:-.4s"/>
    <line class="streak" x1="520" y1="180" x2="520" y2="220" style="animation-delay:-.8s"/>
    <line class="streak" x1="690" y1="40" x2="690" y2="80" style="animation-delay:-.2s"/>
  </g>

  <g id="pod">
    <g id="fire">
      <ellipse cx="600" cy="230" rx="26" ry="60" fill="url(#flame)"/>
      <ellipse cx="578" cy="222" rx="10" ry="34" fill="url(#flame)"/>
      <ellipse cx="622" cy="222" rx="10" ry="34" fill="url(#flame)"/>
    </g>
    <path d="M600 60 L648 120 L640 200 L560 200 L552 120 Z" fill="url(#hull)" stroke="#1c2030" stroke-width="3"/>
    <path d="M566 118 L634 118 L630 150 L570 150 Z" fill="#20253a"/>
    <path d="M552 120 L520 150 L540 200 L560 200 Z" fill="#2c3245" stroke="#1c2030" stroke-width="3"/>
    <path d="M648 120 L680 150 L660 200 L640 200 Z" fill="#2c3245" stroke="#1c2030" stroke-width="3"/>
    <circle cx="600" cy="90" r="9" fill="#ffab2e"/>
    <circle cx="600" cy="90" r="4" fill="#fff4c2"/>
  </g>

  <text class="title" x="60" y="150">DROP-POD</text>
  <text class="sub" x="62" y="190">CODE CAPSULES · HOME → WORK</text>
  <text class="sub" x="62" y="222" style="fill:#5f6a85;font-size:15px">Public on purpose. Nothing secret rides in a pod.</text>
</svg>
